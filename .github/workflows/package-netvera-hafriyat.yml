name: Package Netvera Hafriyat Pro

on:
  push:
    branches:
      - fix/admin-sync-db-cleanup
    paths:
      - "alanyahafriyat.tr/alanyahafriyat.tr/**"
      - ".github/workflows/package-netvera-hafriyat.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/admin-sync-db-cleanup

      - name: Prepare production-only package
        shell: bash
        run: |
          set -euo pipefail
          SRC="alanyahafriyat.tr/alanyahafriyat.tr"
          OUT="$RUNNER_TEMP/netvera-hafriyat"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp -a "$SRC"/. "$OUT"/

          rm -rf "$OUT/ersan hafriyat görseller" "$OUT/.git" "$OUT/.github" "$OUT/.idea" "$OUT/.vscode" "$OUT/node_modules" "$OUT/vendor" 2>/dev/null || true
          rm -f "$OUT/README.md" "$OUT/CPANEL-KURULUM.md" "$OUT/start-8020.bat" "$OUT/.gitignore" "$OUT/.env.example" "$OUT/database/build_install_sql.php" "$OUT/storage/database.sqlite" 2>/dev/null || true
          find "$OUT" -type f \( -name ".sync-conflict*" -o -name "*.log" -o -name "*.bak" -o -name "*.old" -o -name "*.tmp" -o -name "*.orig" -o -name ".DS_Store" -o -name "Thumbs.db" -o -name "*.md" \) -delete || true

          if [ -d "$OUT/public/uploads" ]; then
            find "$OUT/public/uploads" -mindepth 1 -maxdepth 1 ! -name ".htaccess" ! -name "genel" -exec rm -rf {} +
            if [ -d "$OUT/public/uploads/genel" ]; then
              find "$OUT/public/uploads/genel" -type f ! -name "netvera-hafriyat-logo.webp" ! -name "netvera-hafriyat-favicon.webp" -delete
            fi
          fi

          find "$OUT/storage" -type f \( -name "*.log" -o -name "*.cache" -o -name "*.tmp" \) -delete 2>/dev/null || true

          find "$OUT" -type f \( -name "*.php" -o -name "*.css" -o -name "*.js" -o -name "*.html" -o -name "*.sql" \) -print0 | xargs -0 -r sed -i -E '/(ChatGPT|OpenAI|Claude|Gemini|yapay zeka|AI generated|generated by|fresh install|Content Pack v[0-9]+|stok medya paketi|demo paketi|placeholder content|development only)/Id'

          printf '%s\n' \
            'APP_NAME="Netvera Hafriyat"' \
            'APP_ENV=production' \
            'APP_DEBUG=false' \
            'APP_URL=https://domain.com' \
            'APP_KEY=' \
            'APP_VERSION=1.0.0' \
            '' \
            'DB_CONNECTION=mysql' \
            'DB_HOST=localhost' \
            'DB_PORT=3306' \
            'DB_DATABASE=' \
            'DB_USERNAME=' \
            'DB_PASSWORD=' \
            'DB_DATABASE_SQLITE=storage/database.sqlite' \
            '' \
            'DIGIKEY_ENV=production' \
            'DIGIKEY_BASE_URL=' \
            'DIGIKEY_API_SECRET=' \
            'DIGIKEY_PRODUCT_SLUG=netvera-hafriyat-cms' \
            'DIGIKEY_API_TIMEOUT=10' \
            'DIGIKEY_VERIFY_INTERVAL_HOURS=24' \
            'DIGIKEY_GRACE_DAYS=7' \
            'DIGIKEY_CACHE_SECRET=' > "$OUT/.env"

          test -f "$OUT/app/Core/Seeder.php"
          test -f "$OUT/database/database.sql"
          test -f "$OUT/public/index.php"
          test -f "$OUT/.htaccess"
          test -f "$OUT/.env"
          test -f "$OUT/public/uploads/genel/netvera-hafriyat-logo.webp"
          test -f "$OUT/public/uploads/genel/netvera-hafriyat-favicon.webp"

          if grep -RIniE --exclude-dir="storage" "(ChatGPT|OpenAI|Claude|Gemini|yapay zeka)" "$OUT"; then
            echo "AI trace check failed."
            exit 1
          fi

          if grep -RIniE "(Ersan Hafriyat|ersanhafriyat|Ersan Yönetici)" "$OUT"; then
            echo "Legacy brand trace check failed."
            exit 1
          fi

          cd "$OUT"
          zip -rq "$GITHUB_WORKSPACE/Netvera-Hafriyat-Yazilimi-Pro-TEMIZ.zip" .

      - name: Publish clean downloadable package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="netvera-hafriyat-pro-latest"
          ASSET="Netvera-Hafriyat-Yazilimi-Pro-TEMIZ.zip"
          NOTES="Canlı cPanel kurulumu için temizlenmiş Netvera Hafriyat Yazılımı Pro paketi. Geliştirme dosyaları, eski marka ve görsel artıkları, yerel dosyalar ve gereksiz belgeler çıkarılmıştır. Güncel database.sql dahildir."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
            gh release edit "$TAG" --target "$GITHUB_SHA" --title "Netvera Hafriyat Yazılımı Pro" --notes "$NOTES"
          else
            gh release create "$TAG" "$ASSET" --target "$GITHUB_SHA" --title "Netvera Hafriyat Yazılımı Pro" --notes "$NOTES"
          fi
